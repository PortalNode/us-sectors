name: Update market prices

on:
  schedule:
    # أسعار مؤرخة أثناء الجلسة الأمريكية: 9:35–16:00 بتوقيت نيويورك
    # (UTC 13:35–20:00). يومي الاثنين–الجمعة.
    - cron: '5,20,35,50 13-19 * * 1-5'
    - cron: '10,25,40,55 13-19 * * 1-5'
    # لقطة الإغلاق الرسمي بعد نهاية الجلسة: 16:15، 17:15، 18:15، 21:15 نيويورك.
    - cron: '15 20,21,22 1-5 * *'
    - cron: '15 1 * * 2-6'
  workflow_dispatch:

permissions:
  contents: write
  actions: write
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v6
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Update price snapshot
        run: node scripts/build-us-data.mjs dist
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add dist
          if git diff --cached --quiet; then
            echo "لا تغييرات"
          else
            git commit -m "تحديث أسعار ونتائج: $(date -u +'%Y-%m-%d %H:%M UTC')"
            git push
          fi
