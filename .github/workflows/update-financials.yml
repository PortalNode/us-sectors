name: Update EDGAR financials

on:
  schedule:
    # السبت 06:00 UTC — تحديث أسبوعي للقوائم المالية السنوية
    - cron: '0 6 * * 6'
  workflow_dispatch:

permissions:
  contents: write
  actions: write
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out source
        uses: actions/checkout@v6
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Rebuild sector financials from SEC EDGAR
        env:
          SEC_USER_AGENT: 'us-sectors site (contact via github.com/PortalNode)'
        run: node scripts/build-us-financials.mjs dist
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add dist
          if git diff --cached --quiet; then
            echo "لا تغييرات"
          else
            git commit -m "تحديث النتائج المالية من SEC EDGAR: $(date -u +'%Y-%m-%d')"
            git push
          fi
